[package]
name = "camera-studio"
version = "1.0.1-dev"
edition = "2024"
description = "A fast, GPU-accelerated camera app for the Linux desktop"
authors = ["Hồ Sỹ Thế"]
license = "MIT"
repository = "https://github.com/hsthe29/camera-studio"
homepage = "https://github.com/hsthe29/camera-studio"
readme = "README.md"
keywords = ["camera", "webcam", "gtk4", "gstreamer", "linux"]
categories = ["multimedia::video", "gui"]

[features]
# Real GTK 4.20 / libadwaita 1.8 widgets (Ubuntu 26.04+). install.sh turns this
# off for older systems such as Ubuntu 24.04, which use src/compat.rs fallbacks.
default = ["modern"]
modern = ["gtk/v4_20", "adw/v1_8"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gst = { package = "gstreamer", version = "0.25", features = ["v1_24"] }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
anyhow = "1"
async-channel = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
